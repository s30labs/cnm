# =============================================================================
# stable_key_rules.conf — reglas de derivación del stable_key por subtype.
# EXTERNAS al código: añadir un subtype nuevo NO requiere tocar el .pl.
#
# El motor prueba las reglas EN ORDEN y usa la primera que casa. Formato:
#
#   <clase>|<selector>|<patrón>
#
# Clases (qué hacer para derivar el stable_key):
#   iid_all       el stable_key es 'ALL' (instancia única o agregado de tabla)
#   iid_direct    el stable_key es el propio iid (cuando el iid YA es un nombre estable)
#   label_prefix  el stable_key sale del label quitando un prefijo fijo y el '(host)' final
#   iid_weak      úsese el iid, pero MARCADO como identidad débil (iid/label no fiables)
#
# Selector (a qué métricas aplica la regla):
#   subtype=<nombre>        subtype exacto
#   subtype_re=<regex>      subtype que casa la regex
#   iid_in=ALL,TABLE        cuando el iid es uno de esos valores (para iid_all)
#   *                       cualquiera (regla catch-all, debe ir la ÚLTIMA)
#
# Patrón (solo para label_prefix): el prefijo (regex) a quitar del inicio del label.
#   El nombre estable es lo que queda tras el prefijo y antes del ' (hostname)' final.
#   Se admite \( \) \/ etc. Sin distinción de mayúsculas.
#
# Las reglas se evalúan de arriba a abajo; las más específicas primero.
# =============================================================================

# ---- 1. instancia única / agregado de tabla SNMP -> 'ALL' -------------------
iid_all|iid_in=ALL,TABLE|

# ---- 2. subtypes cuyo iid YA es un nombre estable (no numérico) -------------
iid_direct|subtype_re=^netscaler_|

# ---- 3. interfaces de red (varias métricas sobre la misma interfaz) ---------
label_prefix|subtype=traffic_mibii_if|^TRAFICO EN INTERFAZ\s+
label_prefix|subtype=status_mibii_if|^ESTADO DE INTERFAZ\s+
label_prefix|subtype=errors_mibii_if|^ERRORES EN INTERFAZ\s+
label_prefix|subtype=pkts_discard_mibii_if|^PAQUETES DESCARTADOS EN INTERFAZ\s+
label_prefix|subtype=pkts_type_mibii_if|^TIPO DE TRAFICO EN INTERFAZ \(UCAST\/NUCAST\)\s+

# ---- 4. discos / almacenamiento ---------------------------------------------
label_prefix|subtype=disk_mibhost|^USO DE DISCO\s+
label_prefix|subtype=disk_mibhostp|^USO DE DISCO\s+
label_prefix|subtype=ucd_disk_acc|^ACCESO A DISCO\s+
label_prefix|subtype=custom_454f50d7|^NAS DISK STATUS\s+

# ---- 5. VMware --------------------------------------------------------------
label_prefix|subtype=vmware_vm_status|^ESTADO DE VM\s+
label_prefix|subtype=vmware_mem_cfg|^MEMORIA CONFIGURADA EN VM\s+

# ---- 6. hardware Cisco (identidad DÉBIL: el label mezcla estado con id) ------
# Nota: "SW1, Sensor1, GREEN" incluye el estado -> se marca débil a propósito.
iid_weak|subtype=cisco_fan_state|
iid_weak|subtype=cisco_powersup_state|
iid_weak|subtype=cisco_temperature_state|
label_prefix|subtype=cisco_memory|^USO DE MEMORIA\s+

# ---- 7. Fortigate: identidad débil (policy id reasignable, label a veces vacío)
iid_weak|subtype=fortigate_pol_traffic|

# ---- (opcional) catch-all: si se quiere forzar iid como fallback explícito ---
# iid_weak|*|
