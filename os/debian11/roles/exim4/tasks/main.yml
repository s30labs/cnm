---
# This playbook contains common plays that will be run on all nodes.
- include_vars: /cfg/cnm_vars.yml
  tags: exim4

- name: Install packages
  apt:
    name: [ 'exim4', 'exim4-base', 'exim4-config', 'exim4-daemon-light' ]
    state: present
    force: yes
    update_cache: yes
  become: true
  tags: rrdtool
  
- name: Create dir /opt/data/buzones/cnmnotifier/new
  file: path=/opt/data/buzones/cnmnotifier/new state=directory owner=www-data group=www-data mode=0775
  tags: exim4

- name: Config Files
  copy: src="{{ item }}" dest="/etc/exim4/{{ item }}"  owner=root group=root mode=0640
  with_items:
    - cnm-mta-local
    - exim4.conf
  tags: exim4
  notify:
   - restart exim4

# exim4.conf ejecuta el filtro de sistema como www-data (system_filter_user y
# system_filter_group): con root:root 0640 no puede leerlo y cada entrega falla
# con «Error in system filter ... Permission denied (euid=33 egid=33)»
- name: System filter
  copy: src=cnm-mta-filter dest=/etc/exim4/cnm-mta-filter  owner=root group=www-data mode=0640
  tags: exim4
  notify:
   - restart exim4

...
