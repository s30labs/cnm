; ------------------------------------------------------------------------------
; CNM · endurecimiento de PHP para el SAPI de Apache (mod_php)
;
; Lo despliega el rol apache-php en /etc/php/<version>/apache2/conf.d/ con el
; prefijo 99- para que se cargue el ultimo y prevalezca sobre php.ini.
; Este fichero NO se aplica al CLI: las directivas de aqui solo tienen sentido
; para peticiones HTTP.
;
; Va aparte de php.ini a proposito: php.ini es una copia completa de la
; distribucion y un cambio de seguridad se pierde dentro de 2.000 lineas. Aqui
; cada directiva lleva su motivo.
;
; Referencia: claude/DOC-CNM-03-Seguridad.md (proyecto CNM)
; ------------------------------------------------------------------------------

