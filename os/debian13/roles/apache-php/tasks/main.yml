---
# This playbook contains common plays that will be run on all nodes.
- include_vars: /cfg/cnm_vars.yml
  tags: apache-php

# Variables propias del cliente, opcionales. /cfg/cnm_vars.yml es de CNM y vale
# para todos los roles; lo que depende de cada instalacion (hoy, el certificado
# HTTPS que entrega el departamento de sistemas del cliente) va aparte, en
# /cfg/client_vars.yml. Si existe, se carga DESPUES y sus valores prevalecen;
# si no existe, el rol se comporta exactamente como hasta ahora.
# Referencia: DOC-CNM-03 4.56.
- name: Check client variables (/cfg/client_vars.yml)
  stat: path=/cfg/client_vars.yml
  register: client_vars_file
  tags: apache-php

- name: Load client variables (/cfg/client_vars.yml)
  include_vars: /cfg/client_vars.yml
  when: client_vars_file.stat.exists
  tags: apache-php

- name: Certificate Info
  debug:
    msg: "{{ item }}"
  with_items:
   - "{{ SSLCertificateKeyFile }}"
   - "{{ SSLCertificateFile }}"
   - "{{ SSLCertificateChainFile }}"
   - "client_vars.yml: {{ 'cargado' if client_vars_file.stat.exists else 'no existe (certificado por defecto)' }}"

  tags: apache-php

# FML FALTA php-propro-dev
#name: [ 'apache2', 'apache2-dev', 'libapache2-mod-perl2', 'libapache2-mod-php7.4', 'php7.4-dba', 'php-db', 'php-fpdf', 'php-mail', 'php-net-smtp', 'php-net-socket', 'php-pear', 'php7.4', 'php7.4-cli', 'php7.4-common', 'php7.4-dev', 'php7.4-gd', 'php7.4-mysql', 'php7.4-curl', 'php7.4-xsl', 'php7.4-ldap', 'php7.4-imap', 'php7.4-mbstring', 'php-raphf', 'php-raphf-dev', 'php-propro', 'php-apcu', 'php-pecl-http']

- name: Install packages
  apt:
    name: [ 'apache2', 'apache2-dev', 'libapache2-mod-perl2', 'libapache2-mod-php', 'php-dba', 'php-fpdf', 'php-mail', 'php-net-smtp', 'php-net-socket', 'php-pear', 'php', 'php-cli', 'php-common', 'php-dev', 'php-gd', 'php-mysql', 'php-curl', 'php-xsl', 'php-ldap', 'php-mbstring', 'php-raphf', 'php-apcu', 'php-http']
    state: present
    force: yes
    update_cache: yes
  become: true
  tags: apache-php

- name: Check directory /opt/php-utils/progress_bar
  file: path=/opt/php-utils/progress_bar state=directory owner=www-data group=www-data mode=0755
  tags: apache-php

- name: Copy progress_bar files
  copy: src={{ item.src }} dest={{ item.dest }} owner=root group=root mode=0644
  with_items:
    - { src: 'progress_bar/Manager.php', dest: '/opt/php-utils/progress_bar/Manager.php' }
    - { src: 'progress_bar/Registry.php', dest: '/opt/php-utils/progress_bar/Registry.php' }
    - { src: 'progress_bar/README.md', dest: '/opt/php-utils/progress_bar/README.md' }
  tags: apache-php
  
- name: Check directory /var/log/apache2
  file: path=/var/log/apache2 state=directory owner=www-data group=www-data mode=0755
  tags: apache-php

- name: Check /var/log/apache2/cnm_gui.log
  stat: path=/var/log/apache2/cnm_gui.log
  register: cnm_gui
  tags: apache-php

- name: Verify /var/log/apache2/cnm_gui.log
  file: path=/var/log/apache2/cnm_gui.log state=touch owner=www-data group=www-data mode=0664
  tags: apache-php

- name: Verify /var/log/apache2/access.log
  file: path=/var/log/apache2/access.log state=touch owner=www-data group=www-data mode=0664
  tags: apache-php

- name: Verify /var/log/apache2/error.log
  file: path=/var/log/apache2/error.log state=touch owner=www-data group=www-data mode=0664
  tags: apache-php

- name: Check legacy install error with cgi module
  stat: path=/etc/apache2/mods-enabled/cgi.load
  register: cgi_file
  tags: apache-php

- name: Repair legacy install error with cgi module
  file: path=/etc/apache2/mods-enabled/cgi.load state=absent
  when: cgi_file.stat.islnk is defined and cgi_file.stat.islnk == False
  tags: apache-php

- name: Enable modules
  apache2_module: state=present name={{ item }}
  with_items:
    - ssl
    - deflate
    - proxy
    - proxy_http
    - headers
    - expires
    - rewrite
    - cgi
  tags: apache-php

- name: cnm_default.pem
  copy: src=cnm_default.pem dest=/etc/apache2  owner=root group=root mode=0600
  tags: apache-php

- name: Check directory /store/www-user/apache2
  file: path=/store/www-user/apache2 state=directory owner=www-data group=www-data mode=0755
  tags: apache-php

- name: Check /store/www-user/apache2/cnm-http-proxy
  stat: path=/store/www-user/apache2/cnm-http-proxy
  register: cnm_http_proxy
  tags: apache-php

- name: cnm-proxy option
  file: path=/store/www-user/apache2/cnm-http-proxy state=touch owner=www-data group=www-data mode=0755
  when: cnm_http_proxy.stat.exists == 0
  tags: apache-php

- name: logrotate (rotation of cgi log file)
  copy: src=httpd.logrotate dest=/etc/logrotate.d/httpd  owner=root group=root mode=0600
  tags: apache-php

#- name: logrotate (change apache2 user owner and group)
#  shell: sed -i 's/create 640 root adm/create 640 www-data www-data/g' /etc/logrotate.d/apache2
#  tags: apache-php

- name: logrotate (change apache2 user owner and group)
  replace: path=/etc/logrotate.d/apache2 regexp='create 640 root adm' replace='create 640 www-data www-data'
  tags: apache-php


- name: PHP Apache config file
  copy: src=php.ini.apache dest=/etc/php/8.4/apache2/php.ini  owner=root group=root mode=0644
  tags: apache-php
  notify:
   - restart apache2

- name: PHP CLI config file
  copy: src=php.ini.cli dest=/etc/php/8.4/cli/php.ini  owner=root group=root mode=0644
  tags: apache-php

# Endurecimiento de PHP para Apache, en conf.d y no en php.ini: ver la cabecera
# de files/php-cnm-hardening.ini. Referencia: DOC-CNM-03 4.43 (M2 y M7).
- name: PHP Apache hardening (conf.d/99-cnm-hardening.ini)
  copy: src=php-cnm-hardening.ini dest=/etc/php/8.4/apache2/conf.d/99-cnm-hardening.ini owner=root group=root mode=0644
  tags: apache-php
  notify:
   - restart apache2

# El 23-oct-2026 la mitigacion de PHP2Shell se aplico a mano con este nombre.
# Su contenido queda dentro de 99-cnm-hardening.ini: se retira para que no
# haya dos ficheros diciendo lo mismo. En un equipo que no lo tenga, no hace nada.
- name: Remove manual PHP2Shell mitigation (now in 99-cnm-hardening.ini)
  file: path=/etc/php/8.4/apache2/conf.d/99-php2shell.ini state=absent
  tags: apache-php
  notify:
   - restart apache2

# Comprueba el valor EFECTIVO con la configuracion que carga Apache, no la del
# CLI. Falla si php no se ejecuta (rc) y si la directiva no se reconoce
# (var_export devuelve false): un vacio no puede pasar por correcto.
# El -d session.save_handler=files NO es parte de lo que se mide: php.ini.apache
# declara session.save_handler = user, y desde PHP 7.2 el CLI aborta el arranque
# con ese valor (rc=255, "cannot be set by ini_set()"). Sin el -d, esta tarea
# fallaria siempre por un motivo ajeno a upload_progress.
- name: Verify session.upload_progress.enabled is off for Apache
  shell: PHP_INI_SCAN_DIR=/etc/php/8.4/apache2/conf.d php -d session.save_handler=files -c /etc/php/8.4/apache2/php.ini -r 'var_export(ini_get("session.upload_progress.enabled"));'
  register: upload_progress
  changed_when: false
  failed_when: upload_progress.rc != 0 or upload_progress.stdout not in ["'0'", "''"]
  tags: apache-php


- name: Check for HTTPREQUEST PHP module
  shell: php -i|grep -i 'http support'|wc -l
  register: http_support
  tags: apache-php

