---
# This playbook contains common plays that will be run on all nodes.
- include_vars: /cfg/cnm_vars.yml
  tags: mysql

- name: Install packages
  apt:
    name: [ 'libdbd-mysql-perl', 'mariadb-client', 'mariadb-server', 'mariadb-common', 'default-libmysqlclient-dev', 'php-mysql', 'python3-mysqldb' ]
    state: present
    force: yes
    update_cache: yes
  become: true
  tags: mysql

- name: Verify paths for persistance data (/store/mysql|/store/mysql_tmp|/store/data)
  file: path={{ item.path }} state=directory owner={{ item.owner }} group={{ item.group }} mode={{ item.mode }}
  with_items:
    - { path: '/store/mysql', owner: 'mysql', group: 'mysql',  mode: '0775' }
    - { path: '/store/mysql_tmp', owner: 'mysql', group: 'mysql', mode: '0755' }
    - { path: '/store/data', owner: 'root', group: 'root', mode: '0777' }
  tags: mysql

- name: Directorio del drop-in de systemd para MariaDB
  become: yes
  file: path=/etc/systemd/system/mariadb.service.d state=directory owner=root group=root mode=0755
  tags: mysql

#--- Bajo systemd NO se lee [mysqld_safe], asi que open_files_limit del my.cnf
#--- no basta. Si MariaDB no consigue descriptores suficientes RECORTA
#--- max_connections y table_open_cache por su cuenta y sin avisar: se
#--- configuran 500 conexiones y el servidor arranca con menos.
- name: Limite de ficheros abiertos de MariaDB
  become: yes
  copy:
    dest: /etc/systemd/system/mariadb.service.d/limits.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      # Gestionado por el rol mysql de CNM. No editar a mano.
      [Service]
      LimitNOFILE=65535
  tags: mysql
  notify:
    - reload systemd
    - restart mysql

- name: Check if directory /var/lib/mysql exists
  stat: path=/var/lib/mysql
  register: var_lib_mysql
  tags: mysql

- name: Check if directory /var/lib/mysql is empty
  shell: "ls -A /var/lib/mysql/ | wc -l"
  register: num_files
  tags: mysql

- name: Move if dir and not empty /var/lib/mysql -> /store/mysql
  shell: mv /var/lib/mysql/* /store/mysql 2>/dev/null
  when: var_lib_mysql.stat.exists and var_lib_mysql.stat.isdir and num_files.stdout != "0"
  tags: mysql

- name: Create symlink /var/lib/mysql -> /store/mysql
  file: path='/var/lib/mysql' src='/store/mysql' state=link owner=root group=root mode='0777' force=true
  tags: mysql


- name: Verify base symlinks
  file: path={{ item.path }} src={{ item.src }} state=link owner=root group=root mode={{ item.mode }}
  with_items:
    - { path: '/opt/data', src: '/store/data', mode: '0777' }
  tags: mysql


- name: Start MySQL service
  become: yes
  become_user: root
  become_method: sudo
  service: name=mysql state=restarted enabled=true
  tags: mysql

- name: Se actualiza la clave de root para todas las cuentas
  mysql_user: name=root host={{ item }} password={{ db_root_password }} priv=*.*:ALL,GRANT column_case_sensitive=false
  with_items:
     - "{{ ansible_hostname }}"
     - 127.0.0.1
     - ::1
     - localhost
  when: db_root_password is defined
  tags: mysql

- name: Create .my.cnf file with root password credentials
  become: yes
  become_user: root
  become_method: sudo
  template: src=my.cnf.root.j2 dest=/root/.my.cnf owner=root group=root mode=0600
  when: db_root_password is defined
  tags: mysql
  notify:
  - restart mysql

- name: Create 50-server.cnf config file 
  become: yes
  become_user: root
  become_method: sudo
  template: src=50-server.cnf.j2 dest=/etc/mysql/mariadb.conf.d/50-server.cnf owner=root group=root mode=0644
  tags: mysql
  notify:
  - restart mysql

- name: MariaDb config Files
  copy: src="{{ item }}" dest="/etc/mysql/mariadb.conf.d/{{ item }}"  owner=root group=root mode=0644
  with_items:
    - 50-client.cnf
    - 50-mysql-clients.cnf
    - 50-mysqld_safe.cnf
    - 60-galera.cnf
  tags: mysql
  notify:
   - restart mysql

- name: delete anonymous MySQL server user for localhost
  action: mysql_user user="" host=localhost state="absent" column_case_sensitive=false
  tags: mysql

- name: remove the MySQL test database
  action: mysql_db db=test state=absent
  tags: mysql

- name: Create databases
  mysql_db: name={{ item }} state=present
  with_items:
   - onm
   - cnm
  tags: mysql

- name: Create onm user and set privileges
  mysql_user: name={{db_user}} password={{db_pwd}} host=localhost priv=*.*:ALL,GRANT state=present column_case_sensitive=false
  tags: mysql

- name: logrotate config
  copy: src=mysql-server.logrotate dest=/etc/logrotate.d/mysql-server  owner=root group=root mode=0640
  tags: mysql

#- name: Script de arranque
#  copy: src=mysql.init dest=/etc/init.d/mysql  owner=root group=root mode=0755
#  tags: mysql

#--- Comprobacion de que el servidor ha aplicado lo que se le ha pedido y no
#--- lo ha recortado por falta de descriptores. Es la unica forma objetiva de
#--- saberlo: el arranque no da ningun error cuando recorta.
- meta: flush_handlers

- name: Leer los limites efectivos de MariaDB
  become: yes
  shell: >
    mysql -N -B -e "SELECT CONCAT(VARIABLE_NAME,'=',GLOBAL_VALUE)
                      FROM information_schema.GLOBAL_VARIABLES
                     WHERE VARIABLE_NAME IN
                     ('MAX_CONNECTIONS','OPEN_FILES_LIMIT','TABLE_OPEN_CACHE','WAIT_TIMEOUT')
                     ORDER BY VARIABLE_NAME"
  register: mysql_limites
  changed_when: false
  failed_when: false
  tags: mysql

- name: Mostrar los limites efectivos
  debug: var=mysql_limites.stdout_lines
  tags: mysql

- name: Avisar si MariaDB ha recortado max_connections
  assert:
    that:
      - "'MAX_CONNECTIONS=' ~ (db_max_connections | default(500)) in mysql_limites.stdout"
    fail_msg: >-
      MariaDB NO ha aplicado max_connections={{ db_max_connections | default(500) }}.
      Valores efectivos: {{ mysql_limites.stdout_lines }}.
      Casi siempre es el limite de descriptores: revisar
      /etc/systemd/system/mariadb.service.d/limits.conf y 'systemctl show mariadb -p LimitNOFILE'.
    success_msg: "Limites aplicados correctamente."
  when: mysql_limites.stdout is defined and mysql_limites.stdout != ''
  tags: mysql

...

